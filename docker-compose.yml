services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pairjob
      POSTGRES_PASSWORD: pairjob
      POSTGRES_DB: pairjob
    ports:
      - "5434:5432"
    volumes:
      - pairjob_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pairjob"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pairjob_postgres:
